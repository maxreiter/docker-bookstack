[global]

error_log = /proc/self/fd/2

syslog.facility = daemon
syslog.ident = php-fpm

log_level = notice
log_limit = 8192
log_buffering = yes

emergency_restart_threshold = 0
emergency_restart_interval = 0

process_control_timeout = 0

process.max = 0

daemonize = yes

include = /etc/php84/php-fpm.d/*.conf
